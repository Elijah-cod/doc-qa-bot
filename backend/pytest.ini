[pytest]
testpaths = tests
pythonpath = .
markers =
    live: hits real Supabase/Gemini (run with: python -m pytest -m live)
addopts = -m "not live"
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The '(timeout|verify)' parameter is deprecated:DeprecationWarning
