name: Keep-alive

# Supabase's free tier pauses a project after ~7 days without activity.
# Calling /ready every 3 days runs a tiny database query through the API.
# Set the repo variable API_URL (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /ready (allows ~2 min for a sleeping free-tier server to wake up)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 25 --retry-all-errors --max-time 90 "${{ vars.API_URL }}/ready"
